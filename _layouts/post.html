---
layout: default
---
<article class="prose">
  <header class="page-heading">
    <a class="back-link" href="{{ '/posts/' | relative_url }}">← Writing archive</a>
    <h1>{{ page.title }}</h1>
    <p class="muted"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
  </header>
  {{ content }}
</article>
