- title: "LiveCoMS Roundtable: Discussing Markov state models after two decades of development v1.0"
  authors: "Daniel M. Zuckerman, Gregory R. Bowman, Amedeo Caflisch, Aaron R. Dinner, Ahmed Fadhluddin, Giuseppe Giangreco, Xuhui Huang, Bettina G. Keller, Stefan Klus, Feliks Nüske, Michael O’Connor, Edina Rosta, Christof Schütte, Gerhard Stock, Vincent Voelz, Jonathan Weare, Antonia S.J.S. Mey"
  date: October 2026
  description: "A roundtable on using Markov state models to interpret molecular dynamics simulations. Researchers offer distinct perspectives on best practices, limitations and extensions of the framework, rather than a single consensus view."
