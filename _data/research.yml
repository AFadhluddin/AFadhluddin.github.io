- title: "Objective-Dependent Biasing of Markov Networks for Relaxation and First Passage"
  authors: "Qingying Wang, Ahmed Fadhluddin, Edina Rosta"
  date: July 2026
  description: "An investigation of how bias potentials affect molecular transition kinetics in Markov networks. The work compares biases designed for global relaxation with those targeting a specific transition, and examines how acceleration changes reaction pathways."
