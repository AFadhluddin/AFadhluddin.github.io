{%- assign org = site.data.organisations[include.id] -%}
{%- assign logo = site.static_files | where: 'path', org.logo | first -%}
<span class="organisation">{% if logo %}<img class="organisation-logo{% if org.dark_background %} organisation-logo--dark{% endif %}" src="{{ org.logo | relative_url }}" width="{{ org.width }}" height="{{ org.height }}" alt="" aria-hidden="true" decoding="async">{% endif %}{{ org.name | escape }}</span>
