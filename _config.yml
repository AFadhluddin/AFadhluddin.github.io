title: Ahmed Fadhluddin
name: Ahmed Fadhluddin
description: Co-founder and CTO building AI infrastructure and compute. Previously a quantitative researcher in energy trading, with a background in theoretical physics.
url: https://afadhluddin.github.io
baseurl: ""
lang: en-GB
timezone: Europe/London
markdown: kramdown
permalink: /:categories/:title/
author:
  name: Ahmed Fadhluddin
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - docs
  - scripts
  - "ahmed profille photo.jpeg"
  - "argo logo .png"
plugins:
  - jekyll-sitemap
  - jekyll-feed
# Match the supported plugin allowlist when checking locally with --safe.
whitelist:
  - jekyll-sitemap
  - jekyll-feed
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
